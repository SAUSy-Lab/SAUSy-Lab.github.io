title: SAUSy Lab
description: Spatial Analysis of Urban Systems at the University of Toronto
url: https://sausy.ca
timezone: America/Toronto

# old WordPress post addresses
permalink: /:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - tools/
