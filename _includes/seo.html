{%- assign seo_url = page.url | absolute_url -%} {%- assign seo_description =
include.description | strip_html | normalize_whitespace | escape -%}
<meta name="description" content="{{ seo_description }}" />
<link rel="canonical" href="{{ seo_url }}" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:type" content="{{ include.type | default: 'website' }}" />
<meta property="og:title" content="{{ include.title | escape }}" />
<meta property="og:description" content="{{ seo_description }}" />
<meta property="og:url" content="{{ seo_url }}" />
{%- if include.image %}
<meta
  property="og:image"
  content="{{ include.image | prepend: '/' | replace_first: '//', '/' | absolute_url }}"
/>
<meta name="twitter:card" content="summary_large_image" />
{%- else %}
<meta name="twitter:card" content="summary" />
{%- endif %}
